[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioseq-optimization"
version = "0.6.2"
description = "Multi-algorithm sequence design with motif composition and position diversity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "numba>=0.60", "pandas>=2", "torch>=2.1"]

[project.optional-dependencies]
analysis = ["scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "logomaker>=0.8"]
motifs = ["tangermeme>=1.3,<2", "scipy>=1.10"]
dev = ["pytest>=7.4", "build>=1", "ruff>=0.8"]

[project.urls]
Repository = "https://github.com/UTR-CODE/bioseq-optimization"

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["sequence_optimization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
