[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioseq-optimization"
version = "0.1.0"
description = "Model-agnostic DNA and RNA activity optimization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2",
    "pyarrow>=14",
    "torch>=2.1",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "einops>=0.7",
    "tensorly>=0.8",
    "tensorly-torch>=0.5",
]

[tool.setuptools.packages.find]
include = ["BioSeqBench*", "sequence_optimization*"]

[tool.setuptools.package-data]
BioSeqBench = [
    "checkpoints/strong_v2_sklearn/utr5_mpra/optimus5prime/best.pt",
    "checkpoints/strong_deepstarr_paper_v1/deepstarr/deepstarr_paper/best.pt",
    "checkpoints/strong_yeast_dream2022_autosome_v3_validation_5k/yeast_gpra_dream2022/autosome_legnet/best_val.pt",
    "checkpoints/strong_zhao2022_ptrc_v1/zhao2022_ptrc_promoters/sequence_cnn/model.pt",
    "checkpoints/strong_zhou2026_l3_position_v2/zhou2026_l3_promoters/zhou_l3_cnn/best.pt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
