[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioseq-optimization"
version = "0.1.0"
description = "Model-agnostic DNA and RNA activity optimization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2",
    "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["sequence_optimization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
